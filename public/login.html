<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – DPCD Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0a2240;
      --teal: #00a99d;
      --gold: #f5a623;
      --red: #e63946;
      --surface: #f0f4f8;
      --white: #ffffff;
      --text: #1a2332;
      --muted: #6b7a8d;
      --border: #dde3ec;
      --shadow: 0 4px 24px rgba(10,34,64,0.12);
    }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, var(--navy) 0%, #1a3a5c 50%, #0d4a6b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .login-card {
      background: var(--white);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow), 0 0 0 1px rgba(255,255,255,0.1);
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 36px;
    }
    .brand-logo {
      width: 64px;
      height: 64px;
      background: var(--navy);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .brand-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.5px;
    }
    .brand-sub {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    h2 {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--surface);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }
    input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(0,169,157,0.12);
      background: var(--white);
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-login:hover { background: #1a3a5c; }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--red);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 24px;
    }
    .input-wrap {
      position: relative;
    }
    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 18px;
      padding: 4px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">📊</div>
      <div class="brand-name">DPCD Tracker</div>
      <div class="brand-sub">Pertamina Patra Niaga</div>
    </div>
    <h2>Selamat Datang</h2>
    <p class="subtitle">Masuk ke sistem monitoring proyek</p>
    <div class="error-msg" id="errMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukkan username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password" required>
          <button type="button" class="toggle-pw" id="togglePw">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="btnLogin">Masuk</button>
    </form>
    <p class="footer-note">Hubungi administrator jika lupa password</p>
  </div>
  <script>
    const form = document.getElementById('loginForm');
    const errMsg = document.getElementById('errMsg');
    const btnLogin = document.getElementById('btnLogin');
    const togglePw = document.getElementById('togglePw');
    const pwInput = document.getElementById('password');

    // If already logged in, redirect
    if (localStorage.getItem('dpcd_token')) {
      window.location.href = '/';
    }

    togglePw.addEventListener('click', () => {
      pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
      togglePw.textContent = pwInput.type === 'password' ? '👁️' : '🙈';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errMsg.style.display = 'none';
      btnLogin.disabled = true;
      btnLogin.textContent = 'Memproses...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login gagal');

        localStorage.setItem('dpcd_token', data.token);
        localStorage.setItem('dpcd_user', JSON.stringify(data.user));
        window.location.href = '/';
      } catch (err) {
        errMsg.textContent = err.message;
        errMsg.style.display = 'block';
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
