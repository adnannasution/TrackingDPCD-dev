  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"id\"><head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Dashboard Monitoring Digitalisasi DPCD<\/title>\n    <!-- Offline build: no web fonts; uses Inter-if-installed → system font stack -->\n    <style>/* ===================================================================\n   DPCD PROJECT MONITORING — Design System\n   Data-dense professional (Linear/Jira/Asana). Deep navy + neutrals,\n   RAG colors kept prominent. Font: Inter.\n   =================================================================== */\n:root {\n    /* Brand / navy */\n    --navy-900:#0A1A30;\n    --navy-800:#0E2444;\n    --navy-700:#13335c;\n    --navy-600:#1c4576;\n    --navy-accent:#2f6fed;\n\n    /* Ink / text */\n    --ink:#172033;\n    --ink-2:#5a6678;\n    --ink-3:#8c97a8;\n\n    /* Surfaces & lines */\n    --bg:#eef1f6;\n    --surface:#ffffff;\n    --surface-2:#f7f9fc;\n    --surface-3:#f1f4f9;\n    --line:#e2e7ef;\n    --line-2:#eef1f6;\n\n    /* RAG — kept bold & saturated */\n    --done:#2563eb;       --done-bg:#eaf1fe;     --done-bd:#c5d8fb;\n    --ontrack:#15a34a;    --ontrack-bg:#e8f7ee;  --ontrack-bd:#bce6cb;\n    --warn:#d9890b;       --warn-bg:#fdf3e2;     --warn-bd:#f4ddb0;\n    --crit:#dc2626;       --crit-bg:#fdecec;     --crit-bd:#f6c9c9;\n    --idle:#94a3b8;       --idle-bg:#eef1f5;     --idle-bd:#d6dce4;\n\n    /* Gantt bars */\n    --bar-plan:#a9c0db;\n    --bar-plan-bd:#8ba9cb;\n    --bar-actual:#0e7c86;\n    --bar-actual-overlay:rgba(255,255,255,0.28);\n\n    --shadow-sm:0 1px 2px rgba(16,32,58,0.06), 0 1px 3px rgba(16,32,58,0.04);\n    --shadow-md:0 4px 14px rgba(16,32,58,0.10);\n    --shadow-lg:0 18px 50px rgba(10,26,48,0.28);\n    --radius:8px;\n    --radius-sm:6px;\n    --total-columns:24;\n    --action-col-w:96px;\n    --activity-col-w:356px;\n\n    /* legacy aliases used by some JS-generated markup */\n    --primary-blue:var(--navy-800);\n    --border-color:var(--line);\n    --milestone-color:#0f766e;\n}\n\n* { box-sizing:border-box; }\nhtml { -webkit-text-size-adjust:100%; }\nbody {\n    font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;\n    font-feature-settings:'cv05' 1,'ss01' 1;\n    margin:0; background:var(--bg); color:var(--ink);\n    font-size:14px; line-height:1.45; overscroll-behavior-y:none;\n    -webkit-font-smoothing:antialiased;\n}\n.num { font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; }\n.app { max-width:1480px; margin:0 auto; padding:14px 18px 40px; }\n\n/* ===== TOP APP BAR ===== */\n.appbar {\n    background:linear-gradient(100deg,var(--navy-900),var(--navy-700));\n    color:#fff; border-radius:var(--radius); padding:14px 22px;\n    display:flex; align-items:center; gap:18px; box-shadow:var(--shadow-md);\n    position:relative; overflow:hidden;\n}\n.appbar::after { content:''; position:absolute; right:-40px; top:-60px; width:240px; height:240px;\n    background:radial-gradient(circle at center,rgba(47,111,237,0.35),transparent 65%); pointer-events:none; }\n.appbar-mark { width:38px; height:38px; border-radius:9px; background:rgba(255,255,255,0.10);\n    border:1px solid rgba(255,255,255,0.18); display:flex; align-items:center; justify-content:center;\n    font-weight:800; letter-spacing:-0.5px; font-size:0.92rem; flex-shrink:0; color:#cfe0ff; }\n.appbar-title { display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }\n.appbar-title h1 { margin:0; font-size:1.06rem; font-weight:700; letter-spacing:-0.2px; }\n.appbar-title .sub { font-size:0.74rem; color:rgba(255,255,255,0.62); font-weight:500; letter-spacing:0.2px; }\n.appbar-org { text-align:right; line-height:1.25; z-index:1; }\n.appbar-org .org-main { font-weight:800; font-size:0.92rem; letter-spacing:1px; }\n.appbar-org .org-sub { font-size:0.62rem; color:#ff9b9b; letter-spacing:0.6px; font-weight:600; text-transform:uppercase; }\n\n/* ===== DATA SOURCE STRIP ===== */\n.datasource-bar {\n    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);\n    padding:9px 14px; margin-top:12px; display:flex; align-items:center; gap:12px;\n    flex-wrap:wrap; font-size:0.8rem; box-shadow:var(--shadow-sm);\n}\n.datasource-bar .ds-label { color:var(--ink-3); font-weight:600; display:flex; align-items:center; gap:6px; white-space:nowrap; }\n.datasource-bar .ds-path {\n    flex:1; min-width:120px; background:var(--surface-3); padding:5px 11px; border-radius:6px;\n    font-family:'IBM Plex Mono',ui-monospace,Menlo,monospace; font-size:0.76rem; color:var(--ink-2);\n    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border:1px solid var(--line-2);\n}\n.datasource-bar .ds-status {\n    display:flex; align-items:center; gap:6px; white-space:nowrap;\n    padding:4px 11px; border-radius:20px; font-size:0.72rem; font-weight:700;\n}\n.ds-status.connected { background:var(--ontrack-bg); color:#0f7a37; }\n.ds-status.disconnected { background:var(--crit-bg); color:var(--crit); }\n.ds-status.idle { background:var(--surface-3); color:var(--ink-2); }\n.ds-dot { width:7px; height:7px; border-radius:50%; background:currentColor; box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent); }\n.ds-btn {\n    background:var(--surface); border:1px solid var(--line); color:var(--ink-2);\n    padding:6px 12px; border-radius:6px; cursor:pointer; font:inherit; font-size:0.76rem;\n    font-weight:600; white-space:nowrap; transition:all 0.15s; display:inline-flex; align-items:center; gap:5px;\n}\n.ds-btn:hover { background:var(--surface-3); border-color:var(--line); color:var(--ink); }\n.ds-btn.primary { background:var(--navy-800); border-color:var(--navy-800); color:#fff; }\n.ds-btn.primary:hover { background:var(--navy-700); }\n\n/* ===== CONTROL BAR (view switch + config + actions) ===== */\n.controlbar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px; }\n.segmented { display:inline-fl
